name: fetch-morrow-zenodo

# 从 Zenodo 拉取 Morrow 100 Ah LFP 数据集（record 24261116 = v1.0.1, open, CC-BY-4.0）
on:
  workflow_dispatch:
    inputs:
      rec:
        description: "Zenodo record id"
        default: "24261116"
        required: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Show disk
        run: df -h /

      - name: Download from Zenodo
        env:
          REC: ${{ inputs.rec }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.parse
          import concurrent.futures as cf

          rec = os.environ.get("REC", "24261116")
          api = f"https://zenodo.org/api/records/{rec}"
          req = urllib.request.Request(api, headers={"Accept": "application/json", "User-Agent": "morrow-fetch/1.0"})
          with urllib.request.urlopen(req, timeout=180) as r:
              j = json.load(r)
          md = j.get("metadata", {})
          print("record:", rec, "version:", md.get("version"), "access:", md.get("access_right"))
          files = j.get("files") or []
          total = sum(int(f.get("size") or 0) for f in files)
          print(f"files={len(files)} total={total/1e9:.2f} GB")
          if not files:
              sys.exit("no files (restricted?)")
          os.makedirs("morrow", exist_ok=True)

          def one(f):
              key = f.get("key")
              size = int(f.get("size") or 0)
              url = f"https://zenodo.org/api/records/{rec}/files/{urllib.parse.quote(str(key))}/content"
              dst = os.path.join("morrow", str(key))
              if os.path.exists(dst) and os.path.getsize(dst) == size:
                  return key
              for a in range(8):
                  try:
                      rq = urllib.request.Request(url, headers={"User-Agent": "morrow-fetch/1.0"})
                      with urllib.request.urlopen(rq, timeout=600) as src, open(dst + ".part", "wb") as out:
                          while True:
                              chunk = src.read(1 << 20)
                              if not chunk: break
                              out.write(chunk)
                      if os.path.getsize(dst + ".part") == size:
                          os.replace(dst + ".part", dst)
                          print("ok", key, size)
                          return key
                      print("size mismatch", key, os.path.getsize(dst + ".part"), size)
                  except Exception as e:
                      print("retry", key, a, repr(e)[:120])
              print("FAILED", key)
              return None

          with cf.ThreadPoolExecutor(max_workers=4) as ex:
              results = list(ex.map(one, files))
          bad = [k for k in results if k is None]
          print("done, failed:", len(bad))
          if bad:
              sys.exit("some files failed")
          PY

      - name: Verify
        run: |
          set -euo pipefail
          du -sh morrow
          ls -lh morrow
          python3 - <<'PY'
          import zipfile, os
          z = os.path.join("morrow", "MORROW__TRFFCXXXXX__bdf-parquet.zip")
          if os.path.exists(z):
              with zipfile.ZipFile(z) as zf:
                  names = zf.namelist()
              print("entries in zip:", len(names))
              print("first 8:", names[:8])
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: morrow-100ah-lfp-v1.0.1
          path: morrow/*
          retention-days: 14
          compression-level: 0