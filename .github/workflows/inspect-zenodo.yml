name: inspect-zenodo

on:
  workflow_dispatch:
    inputs:
      rec:
        default: "24005873"
        required: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dump record info
        env:
          REC: ${{ inputs.rec }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          rec = os.environ["REC"]
          def get(u):
              req = urllib.request.Request(u, headers={"Accept": "application/json", "User-Agent": "morrow-inspect/1.0"})
              with urllib.request.urlopen(req, timeout=120) as r:
                  return json.load(r)
          j = get(f"https://zenodo.org/api/records/{rec}")
          md = j.get("metadata", {})
          files = j.get("files") or []
          print("ID:", j.get("id"), "concept:", j.get("conceptrecid"))
          print("version:", md.get("version"), "date:", md.get("publication_date"))
          print("title:", md.get("title"))
          print("access_right:", md.get("access_right"), " license:", (md.get("license") or {}).get("id"))
          print("file_count:", len(files), " total_bytes:", sum(int(f.get("size") or 0) for f in files))
          print("total_GB: %.2f" % (sum(int(f.get("size") or 0) for f in files)/1e9))
          print("first 12:")
          for f in files[:12]:
              print("   %12d  %s" % (int(f.get("size") or 0), f.get("key")))
          exts = {}
          for f in files:
              e = (f.get("key") or "").split(".")[-1].lower()
              exts[e] = exts.get(e, 0) + 1
          print("extensions:", json.dumps(exts, ensure_ascii=False))
          print("access_request:", (j.get("links") or {}).get("access_request"))
          PY