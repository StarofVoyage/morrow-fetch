name: fetch-zenodo-subset
on:
  workflow_dispatch:
    inputs:
      rec:
        default: "14576042"
        required: true
      pattern:
        description: "只下文件名含此子串的文件（不区分大小写）"
        default: "LISHEN-2C-100%"
        required: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Download subset
        env:
          REC: ${{ inputs.rec }}
          PAT: ${{ inputs.pattern }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, sys
          rec = os.environ["REC"]; pat = os.environ["PAT"].lower()
          req = urllib.request.Request(f"https://zenodo.org/api/records/{rec}",
                headers={"Accept":"application/json","User-Agent":"subset/1.0"})
          with urllib.request.urlopen(req, timeout=180) as r:
              j = json.load(r)
          fo = j.get("files")
          files = fo.get("entries") if isinstance(fo, dict) else fo
          if isinstance(files, dict):
              files = [dict(v, key=k) for k, v in files.items()]
          sel = [f for f in (files or []) if pat in (f.get("key") or "").lower()]
          print("matched:", [f["key"] for f in sel])
          if not sel: sys.exit("no file matched pattern")
          os.makedirs("out", exist_ok=True)
          for f in sel:
              key = f["key"]; size = int(f.get("size") or 0)
              url = f"https://zenodo.org/api/records/{rec}/files/{urllib.parse.quote(key)}/content"
              dst = os.path.join("out", key)
              with urllib.request.urlopen(urllib.request.Request(url,
                    headers={"User-Agent":"subset/1.0"}), timeout=600) as src, open(dst+".part","wb") as o:
                  while True:
                      c = src.read(1<<20)
                      if not c: break
                      o.write(c)
              os.replace(dst+".part", dst)
              print("ok", key, os.path.getsize(dst), "/", size)
          PY
          du -sh out
      - name: Bundle
        run: |
          set -euo pipefail
          cd out && zip -0 -r -q ../subset.zip . && cd ..
          ls -lh subset.zip
          split -b 1900M subset.zip subset.zip.part. || true
      - uses: actions/upload-artifact@v4
        with:
          name: zenodo-subset
          path: |
            subset.zip
            subset.zip.part.*
          retention-days: 14
